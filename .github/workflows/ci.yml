name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs the coverage reporter so the >=80% line and branch thresholds in vitest.config.ts
      # are enforced in CI, not just locally.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
